<svg
        xmlns="http://www.w3.org/2000/svg"
        width="77"
        height="47"
        fill="none"
        viewBox="0 0 77 47"
        aria-labelledby="collegeconnect-logo-title"
>
    <title id="collegeconnect-logo-title">CollegeConnect</title>

    <defs>
        <linearGradient
                id="collegeconnect-gradient"
                x1="10"
                y1="5"
                x2="65"
                y2="42"
                gradientUnits="userSpaceOnUse"
        >
            <stop stop-color="#2563EB"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
    </defs>

    <!-- Graduation Cap -->
    <path
            fill="url(#collegeconnect-gradient)"
            d="M38.5 4 6 17.5 38.5 31 71 17.5 38.5 4Z"
    />

    <!-- Cap Center -->
    <path
            fill="#fff"
            d="M38.5 10.5 18.8 18.7l19.7 8.2 19.7-8.2-19.7-8.2Z"
            opacity=".25"
    />

    <!-- Student/Connection Body -->
    <path
            fill="url(#collegeconnect-gradient)"
            d="M20 24v7.5C20 37.3 28.3 41 38.5 41s18.5-3.7 18.5-9.5V24l-18.5 7.7L20 24Z"
    />

    <!-- Connection Nodes -->
    <circle cx="12" cy="34" r="4" fill="#2563EB"/>
    <circle cx="38.5" cy="44" r="4" fill="#7C3AED"/>
    <circle cx="65" cy="34" r="4" fill="#2563EB"/>

    <!-- Connection Lines -->
    <path
            stroke="url(#collegeconnect-gradient)"
            stroke-width="2.5"
            stroke-linecap="round"
            d="M15.5 36 35 42M61.5 36 42 42"
    />
</svg>