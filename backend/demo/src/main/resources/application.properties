spring.application.name=demo

# ===============================
# MySQL Database
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/collect_connect
spring.datasource.username=root
spring.datasource.password=campusconnect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Server
# ===============================

server.port=8080


# ===============================
# JWT
# ===============================

jwt.secret=CampusConnectSecretKey2026ForJwtAuthenticationVerySecureKey
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG
logging.level.com.campusconnect.demo.config=DEBUG